name: Verificar Atlas

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'docs/**'
      - 'Practica03/ecosistema_v2/02_mysql.sql'
      - 'tools/**'
      - 'Practica03/backups/respaldo_final_240545.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comparar Atlas con el SQL confirmado
        run: |
          python3 tools/verify_atlas.py
          python3 tools/verify_atlas_data.py
